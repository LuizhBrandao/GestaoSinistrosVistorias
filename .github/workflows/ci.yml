name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-dotnet:
    name: .NET 10 Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar Dependências
      run: dotnet restore src/backend/Sinistros.slnx

    - name: Build da Solução (.NET 10)
      run: dotnet build src/backend/Sinistros.slnx --no-restore --configuration Release

    - name: Executar Testes Automatizados (xUnit)
      run: dotnet test src/backend/Sinistros.slnx --no-build --configuration Release --verbosity normal

  build-and-test-bff:
    name: Node.js 24 BFF Build & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: 'src/bff-services/package-lock.json'

    - name: Instalar Dependências
      working-directory: src/bff-services
      run: npm ci

    - name: Build TypeScript
      working-directory: src/bff-services
      run: npm run build

    - name: Executar Testes Automatizados
      working-directory: src/bff-services
      run: npm test

  build-and-test-frontend:
    name: Angular 19+ Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: 'src/frontend/package-lock.json'

    - name: Instalar Dependências
      working-directory: src/frontend
      run: npm ci

    - name: Executar Testes Unitários do Angular
      working-directory: src/frontend
      run: npm test -- --watch=false

    - name: Build Produção da SPA
      working-directory: src/frontend
      run: npm run build
