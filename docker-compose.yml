name: sinistros-vistorias-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: sinistros_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sinistros_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sinistros_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sinistros-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sinistros_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - sinistros-network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: sinistros_backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=sinistros_db;Username=postgres;Password=postgres"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "guest"
      RabbitMQ__Password: "guest"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sinistros-network

  bff:
    build:
      context: ./src/bff-services
      dockerfile: Dockerfile
    container_name: sinistros_bff
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      STORAGE_DIR: "./uploads"
      DOTNET_API_URL: "http://backend:5000"
    ports:
      - "3000:3000"
    volumes:
      - bff_uploads:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - sinistros-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: sinistros_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - bff
    networks:
      - sinistros-network

networks:
  sinistros-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  bff_uploads:
    driver: local
